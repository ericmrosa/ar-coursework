<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="/scan/scan.css">
    <meta name="theme-color" content="#1c1c1c"/>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    
  </head>
  <body>
    <a-scene vr-mode-ui="enabled: false;" loading-screen="enabled: false;" renderer="logarithmicDepthBuffer: true;" arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;" id="scene" embedded gesture-detector>

      <!-- Assets -->
      <a-assets>
          <a-asset-item id="CALC" src="/assets/models/calculator.glb"></a-asset-item>
      </a-assets>
          
      <!-- Markers -->
      <a-marker id="maths" preset="pattern" type="pattern" url="/assets/markers/maths.patt">
        <a-entity position="0 0 0" scale="0.10 0.10 0.10" gltf-model="#CALC"></a-entity>
      </a-marker>

      <!-- Lighting -->
      <a-light type="ambient" color="#888"></a-light>
      <a-light type="directional" position="0 1 0.5" intensity="1"></a-light>

      <a-entity camera></a-entity>
    </a-scene>

    <img id="overlay-image" src="/assets/images/scan_background.png" alt="Overlay Image">

    <button id="start-button"><span>START TOPIC</span></button>
    
    <script src="/scan/scan.js"></script>
  </body>
</html>
