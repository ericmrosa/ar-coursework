<!DOCTYPE html>
<html>
  <head> 
    <link rel="stylesheet" href="/quiz/quiz.css">
    <meta name="theme-color" content="#1c1c1c"/>
  </head>
  <body>
    
    <div id="question_title">
        <p id=title_text>QUESTION 1</p> 
    </div>
    
    <div id="question">
        <p id="question_text">1+1</p> 
    </div>

    <div id="answer_one"> 
        <button id="one_button"></button> 
        <p id="one_text">4</p> 
    </div>

    <div id="answer_two">
        <button id="two_button"></button> 
        <p id="two_text">2</p> 
    </div>

    <div id="answer_three">
        <button id="three_button"></button>   
        <p id="three_text">62</p> 
    </div>

    <div id="answer_four">
        <button id="four_button"></button>  
        <p id="four_text">9</p> 
    </div>

    <button id="refresh_button"></button>
    <button id="home_button"></button>
    
    <div id="quiz-popup" style="display: none;">
      <div id="popup-content">
          <p id="popup-message"></p>
          <p>Redirecting to the home page in <span id="countdown">5</span> seconds...</p>
        </div>
    </div>
  
    <img id="overlay-image" src="/assets/images/quiz_background.png" alt="Overlay Image">

    <script src="/quiz/quiz.js"></script>
  </body>
</html>
